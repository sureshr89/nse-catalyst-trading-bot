name: File 11 Test - Risk Limits
on:
  workflow_dispatch:
jobs:
  test-file-11:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
      - run: python -m py_compile config/trading_limits.py
      - run: python -m pytest -q tests/test_config_s10_14.py -k 'risk_limits'
        env: {PYTHONPATH: .}
