name: FINAL SYSTEM HEALTH CHECK

on:
  workflow_dispatch:

jobs:
  health-check:
    name: Production Data-to-Paper Health Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then python -m pip install -r requirements.txt; fi
          python -m pip install pytest pandas requests streamlit

      - name: Test production imports and health contracts
        env:
          PYTHONPATH: .
        run: python -m pytest -q tests/test_final_system_health_check.py

      - name: Test Streamlit app imports
        env:
          PYTHONPATH: .
        run: python -c "import dashboard.app; print('dashboard.app import: OK')"

      - name: Smoke-test Streamlit startup
        env:
          PYTHONPATH: .
        run: |
          set -e
          timeout 20s streamlit run dashboard/app.py --server.headless true --server.port 8501 > /tmp/streamlit.log 2>&1 &
          pid=$!
          ready=0
          for i in $(seq 1 20); do
            if python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8501/_stcore/health', timeout=2).read()" >/dev/null 2>&1; then
              ready=1
              break
            fi
            sleep 1
          done
          cat /tmp/streamlit.log
          kill "$pid" 2>/dev/null || true
          if [ "$ready" -ne 1 ]; then
            echo 'Streamlit startup health check failed.'
            exit 1
          fi
          echo 'Streamlit startup health check: OK'
