name: FINAL SYSTEM HEALTH CHECK

on:
  workflow_dispatch:

jobs:
  health-check:
    name: Production Data-to-Paper Health Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then python -m pip install -r requirements.txt; fi
          python -m pip install pytest pandas requests

      - name: Run FINAL SYSTEM HEALTH CHECK
        env:
          PYTHONPATH: .
        run: python -m pytest -q tests/test_final_system_health_check.py
