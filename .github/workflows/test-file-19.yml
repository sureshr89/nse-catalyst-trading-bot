name: File 19 Test - Price Data
on:
  workflow_dispatch:
jobs:
  test-file-19:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
      - run: python -m py_compile market/price_data.py
      - run: python -m pytest -q tests/test_price_data.py
        env: {PYTHONPATH: .}
