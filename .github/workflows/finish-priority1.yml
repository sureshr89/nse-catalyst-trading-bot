name: Finish Priority 1 persistence

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch daily PnL restore
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('main.py')
          text = p.read_text(encoding='utf-8-sig')
          old = '        self.daily_pnl = 0.0\n'
          new = '        self.daily_pnl = self._restore_daily_pnl()\n'
          if old in text and 'def _restore_daily_pnl' not in text:
              text = text.replace(old, new, 1)
              marker = '    # ============================================================\n    # CURRENT TIME\n'
              if marker not in text:
                  raise RuntimeError('CURRENT TIME marker not found')
              method = '''    def _restore_daily_pnl(self):\n\n        try:\n            df = self.journal.get_trades()\n            if df.empty or "pnl" not in df.columns:\n                return 0.0\n            today = datetime.now().strftime("%Y-%m-%d")\n            exit_dates = df["exit_time"].astype(str).str[:10]\n            pnl = __import__("pandas").to_numeric(df["pnl"], errors="coerce").fillna(0.0)\n            return round(float(pnl[exit_dates == today].sum()), 2)\n        except Exception as error:\n            print(f"Daily P&L restore skipped: {type(error).__name__}: {error}")\n            return 0.0\n\n'''
              text = text.replace(marker, method + marker, 1)
              p.write_text(text, encoding='utf-8')
          elif 'def _restore_daily_pnl' in text:
              print('daily PnL restore already present')
          else:
              raise RuntimeError('daily_pnl initialization not found')
          PY
      - name: Commit and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add main.py
          git diff --cached --quiet || git commit -m "Restore daily PnL from persistent journal"
          git push
          git rm -f .github/workflows/finish-priority1.yml || true
          git diff --cached --quiet || git commit -m "Remove one-time Priority 1 workflow"
          git push
