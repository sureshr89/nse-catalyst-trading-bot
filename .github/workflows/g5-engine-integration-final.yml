name: G5 Engine Integration FINAL

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest

      - name: Verify clean engine imports
        env:
          PYTHONPATH: .
        run: |
          git rev-parse HEAD
          python -c "from engine.master_engine import MasterEngine; print('MasterEngine OK')"

      - name: Run G5 engine and integration tests
        env:
          PYTHONPATH: .
        run: |
          python -m pytest -q \
            tests/test_master_engine.py \
            tests/test_master_clean_diagnostics.py \
            tests/test_clean_end_to_end_contract.py \
            tests/test_clean_s1_s5_regression.py
