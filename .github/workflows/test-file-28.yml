name: File 28 Test - Paper Trade State Safety
on:
  workflow_dispatch:
jobs:
  test-file-28:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
      - run: python -m pytest -q tests/test_paper_trade_state_safety.py
        env:
          PYTHONPATH: .
