name: G2 NIFTY 500 95% Coverage FINAL

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
      - name: Verify 95% coverage test exists
        run: test -f tests/test_nifty500_95pct_coverage.py
      - name: Run G2 95% coverage test
        run: python -m pytest -q tests/test_nifty500_95pct_coverage.py
