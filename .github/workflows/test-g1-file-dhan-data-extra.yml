name: G1 File 03 - Dhan Data Extra
on:
  workflow_dispatch:
  push:
    paths:
      - 'market/dhan_data.py'
      - 'tests/test_dhan_data_extra.py'
      - '.github/workflows/test-g1-file-dhan-data-extra.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest
      - name: Verify runtime
        run: python -c "import pandas, requests, pytest; print('pandas',pandas.__version__,'requests',requests.__version__,'pytest',pytest.__version__)"
      - name: Show revision
        run: git rev-parse HEAD
      - name: Run File 03
        run: python -m pytest -q tests/test_dhan_data_extra.py
