name: File 14 Test - Strategy Risk Contract
on:
  workflow_dispatch:
jobs:
  test-file-14:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
      - run: python -m py_compile config/settings.py config/trading_limits.py config/trading_rules.py
      - run: python -m pytest -q tests/test_config_s10_14.py
        env: {PYTHONPATH: .}
