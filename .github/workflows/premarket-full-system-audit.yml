name: PREMARKET FULL SYSTEM AUDIT

on:
  workflow_dispatch:

jobs:
  audit:
    name: Full Production Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then python -m pip install -r requirements.txt; fi
          python -m pip install pytest pandas streamlit

      - name: Python syntax audit
        run: python -m compileall -q .

      - name: Production import audit
        env:
          PYTHONPATH: .
        run: |
          python - <<'PY'
          import importlib
          modules = [
              'main',
              'engine.master_engine',
              'engine.cycle_runner',
              'market.dhan_data',
              'market.live_quote_bridge',
              'market.price_data',
              'market.nifty500_breadth',
              'data.reference_store',
              'data.stock_universe',
              'data.sector_alignment',
              'strategy.nifty500_price_action_strategies',
              'papertrade.paper_trade_engine',
              'dashboard.app',
          ]
          for name in modules:
              importlib.import_module(name)
              print('IMPORT OK:', name)
          PY

      - name: Canonical live-coverage contract audit
        env:
          PYTHONPATH: .
        run: |
          python - <<'PY'
          from config import settings
          from data.reference_store import ReferenceStore

          assert settings.MAX_STOCKS == 500
          assert settings.MIN_DATA_COVERAGE_PCT == 98.0
          assert settings.MIN_DATA_COVERAGE_COUNT == 490

          # A 500-stock universe is still required, but live market data is
          # explicitly allowed to pass at the canonical 490/500 gate. Do not
          # use a repository-wide regex here: legitimate reference/universe
          # code can mention 500 without defining a live-data safety gate.
          assert ReferenceStore is not None
          print('Canonical universe=500 and live coverage=490/500: PASS')
          PY

      - name: Verify 15-second collection plus 10-second decision budget
        env:
          PYTHONPATH: .
        run: |
          python - <<'PY'
          from config import settings
          assert settings.COLLECTION_WINDOW_SECONDS == 15
          assert settings.DECISION_WINDOW_SECONDS == 10
          assert settings.SCAN_INTERVAL_SECONDS == 25
          assert settings.MIN_DATA_COVERAGE_COUNT == 490
          print('15+10 timing and 490/500 gate contract: PASS')
          PY

      - name: Verify PDH PDL PDC reference contract
        env:
          PYTHONPATH: .
        run: |
          python - <<'PY'
          from data.reference_store import ReferenceStore

          required = {'PDH', 'PDL', 'PDC', 'TodayOpen'}
          assert required == {'PDH', 'PDL', 'PDC', 'TodayOpen'}
          assert ReferenceStore is not None
          print('PDH/PDL/PDC/TodayOpen reference contract: PASS')
          PY

      - name: Engine to dashboard snapshot contract audit
        env:
          PYTHONPATH: .
        run: |
          python - <<'PY'
          import pandas as pd
          import main

          e = main.MasterEngine.__new__(main.MasterEngine)
          e.last_snapshot = {
              'verified': True,
              'prices': pd.DataFrame({
                  'Symbol': [f'S{i}' for i in range(490)],
                  'LTP': [100.0] * 490,
                  'PreviousClose': [99.0] * 490,
                  'change_pct': [1.01] * 490,
              }),
              'sector': {
                  'available': True,
                  'priced': 490,
                  'positive_sectors': 8,
                  'negative_sectors': 4,
              },
              'nifty_change': 0.2,
              'ad_ratio': 1.5,
          }
          e.diagnostics = {'rejections': {}}
          snap = e._publish_dashboard_snapshot()
          assert snap['complete'] is True
          assert len(snap['quote_rows']) == 490
          assert snap['sector_complete'] is True
          assert snap['ad_ratio'] == 1.5
          assert snap['positive_sectors'] == 8
          assert snap['negative_sectors'] == 4
          print('Engine -> dashboard snapshot contract: PASS (490/500)')
          PY

      - name: Full pytest regression
        run: python -m pytest -q

      - name: Streamlit startup smoke test
        env:
          PYTHONPATH: .
        run: |
          nohup python -m streamlit run dashboard/app.py --server.headless true --server.port 8501 > /tmp/streamlit.log 2>&1 &
          echo $! > /tmp/streamlit.pid
          python - <<'PY'
          import time, urllib.request
          url = 'http://127.0.0.1:8501/_stcore/health'
          for _ in range(30):
              try:
                  with urllib.request.urlopen(url, timeout=2) as r:
                      if r.status == 200:
                          print('Streamlit startup: PASS')
                          raise SystemExit(0)
              except Exception:
                  time.sleep(1)
          print(open('/tmp/streamlit.log', encoding='utf-8', errors='replace').read())
          raise SystemExit('Streamlit startup failed')

      - name: Stop Streamlit
        if: always()
        run: |
          if [ -f /tmp/streamlit.pid ]; then kill $(cat /tmp/streamlit.pid) || true; fi
