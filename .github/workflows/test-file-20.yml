name: File 20 Test - Strategy Integration Contract
on:
  workflow_dispatch:
jobs:
  test-file-20:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
      - run: python -m py_compile strategy/contracts.py strategy/nifty500_price_action_strategies.py
      - run: python -m pytest -q tests/test_strategy_integration_contract.py
        env: {PYTHONPATH: .}
