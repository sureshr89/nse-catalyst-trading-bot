name: G4 S1-S5 Strategy FINAL

on:
  workflow_dispatch:

jobs:
  strategy-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest

      - name: Verify strategy modules
        env:
          PYTHONPATH: .
        run: |
          python - <<'PY'
          from strategy.contracts import STRATEGY_RULES, strategy_metadata
          from strategy.nifty500_price_action_strategies import STRATEGY_DEFINITIONS, evaluate
          assert set(STRATEGY_RULES) == {"S1", "S2", "S3", "S4", "S5"}
          assert set(STRATEGY_DEFINITIONS) == {"S1", "S2", "S3", "S4", "S5"}
          for name in ("OPEN_RETURN", "STRATEGY_1", "STRATEGY_2", "STRATEGY_3", "STRATEGY_4", "STRATEGY_5"):
              try:
                  strategy_metadata(name)
              except ValueError:
                  pass
              else:
                  raise AssertionError(f"legacy strategy accepted: {name}")
          print("G4 strategy contract OK")
          PY

      - name: Run G4 strategy tests
        env:
          PYTHONPATH: .
        run: |
          python -m pytest -q \
            tests/test_clean_contract_boundaries.py \
            tests/test_clean_end_to_end_contract.py \
            tests/test_clean_s1_s5_regression.py
