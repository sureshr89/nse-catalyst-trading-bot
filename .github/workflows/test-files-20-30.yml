name: Full Test 20-30

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Compile project
        run: python -m compileall -q engine market papertrade strategy tests

      - name: Run regression tests 20-30
        env:
          PYTHONPATH: .
        run: |
          python -m pytest -q \
            tests/test_nifty500_breadth.py \
            tests/test_production_gates.py \
            tests/test_strategy_contract_clean.py \
            tests/test_paper_state_safety_clean.py \
            tests/test_master_engine_clean.py \
            tests/test_end_to_end_contract_clean.py \
            tests/test_strategy_boundaries_clean.py \
            tests/test_risk_position_sizing_clean.py \
            tests/test_paper_trade_state_safety_clean.py \
            tests/test_master_alignment_coverage_clean.py \
            tests/test_clean_s1_s5_regression.py
