name: File 21 Test - Production Data Gates

on:
  workflow_dispatch:

jobs:
  test-file-21:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
      - name: Compile production engine
        run: python -m py_compile engine/master_engine.py
      - name: Run File 21 tests
        env:
          PYTHONPATH: .
        run: python -m pytest -q tests/test_production_gates.py
