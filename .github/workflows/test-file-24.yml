name: File 24 Test - Master Engine
on:
  workflow_dispatch:
jobs:
  test-file-24:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
      - run: python -m py_compile engine/master_engine.py
      - run: python -m pytest -q tests/test_master_engine_phase2.py
        env:
          PYTHONPATH: .
