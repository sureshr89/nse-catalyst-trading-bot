name: File 13 Test - Paper Trading Safety
on:
  workflow_dispatch:
jobs:
  test-file-13:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
      - run: python -m py_compile config/settings.py
      - run: python -m pytest -q tests/test_config_s10_14.py -k 'single_s1_s5_market_contract or no_legacy_profit_target'
        env: {PYTHONPATH: .}
