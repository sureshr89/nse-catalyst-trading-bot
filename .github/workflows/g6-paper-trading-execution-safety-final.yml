name: G6 Paper Trading Execution Safety FINAL

on:
  workflow_dispatch:
  push:
    paths:
      - 'papertrade/**'
      - 'tests/test_g6_paper_execution_safety_final.py'
      - '.github/workflows/g6-paper-trading-execution-safety-final.yml'

jobs:
  test:
    name: G6 Paper Trading Safety
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run G6 paper execution safety tests
        run: python -m pytest -q tests/test_g6_paper_execution_safety_final.py
