name: Apply durable persistence integration

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply persistence hooks
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding="utf-8-sig")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly 1 match, found {count}")
              p.write_text(text.replace(old, new, 1), encoding="utf-8")

          # ------------------------------------------------------------
          # PaperTradeEngine: restore/save open-position state.
          # ------------------------------------------------------------
          replace_once(
              "papertrade/paper_trade_engine.py",
              "from config.settings import (\n",
              "from papertrade.persistence import load_engine_state, persist_engine_state\n\nfrom config.settings import (\n",
          )

          replace_once(
              "papertrade/paper_trade_engine.py",
              "        self.available_capital = TOTAL_CAPITAL\n        self.used_capital = 0\n",
              "        self.available_capital = TOTAL_CAPITAL\n        self.used_capital = 0\n\n        # Restore same-day paper state after a Streamlit reboot.\n        state = load_engine_state() or {}\n        if state.get(\"date\") == datetime.now().strftime(\"%Y-%m-%d\"):\n            self.open_positions = state.get(\"open_positions\", {}) or {}\n            self.closed_positions = state.get(\"closed_positions\", []) or []\n            self.trade_counter = int(state.get(\"trade_counter\", 0) or 0)\n            self.available_capital = float(state.get(\"available_capital\", TOTAL_CAPITAL) or TOTAL_CAPITAL)\n            self.used_capital = float(state.get(\"used_capital\", 0) or 0)\n\n    def _persist_state(self):\n        persist_engine_state({\n            \"date\": datetime.now().strftime(\"%Y-%m-%d\"),\n            \"open_positions\": self.open_positions,\n            \"closed_positions\": self.closed_positions[-100:],\n            \"trade_counter\": self.trade_counter,\n            \"available_capital\": self.available_capital,\n            \"used_capital\": self.used_capital,\n        })\n",
          )

          replace_once(
              "papertrade/paper_trade_engine.py",
              "        self.used_capital += position_value\n        self.available_capital -= position_value\n\n        return {\n",
              "        self.used_capital += position_value\n        self.available_capital -= position_value\n        self._persist_state()\n\n        return {\n",
          )

          replace_once(
              "papertrade/paper_trade_engine.py",
              "        del self.open_positions[\n            symbol\n        ]\n\n        return closed\n",
              "        del self.open_positions[\n            symbol\n        ]\n        self._persist_state()\n\n        return closed\n",
          )

          # ------------------------------------------------------------
          # TradeJournal: restore history and mirror closed trades/signals.
          # ------------------------------------------------------------
          replace_once(
              "papertrade/trade_journal.py",
              "from config.settings import (\n",
              "from papertrade.persistence import restore_text, sync_text\n\nfrom config.settings import (\n",
          )

          replace_once(
              "papertrade/trade_journal.py",
              "        self._create_csv_if_missing(\n            self.signal_file,\n            self.SIGNAL_COLUMNS\n        )\n",
              "        self._create_csv_if_missing(\n            self.signal_file,\n            self.SIGNAL_COLUMNS\n        )\n\n        # On a fresh Streamlit instance, recover the durable GitHub copies.\n        restore_text(self.trade_file)\n        restore_text(self.signal_file)\n",
          )

          replace_once(
              "papertrade/trade_journal.py",
              "            writer.writerow(\n                row\n            )\n\n        return {\n\n            \"saved\": True,\n\n            \"trade_id\":\n                trade_id,\n\n            \"file\":\n                self.trade_file\n        }\n",
              "            writer.writerow(\n                row\n            )\n\n        # Trades are rare; mirror each completed trade immediately.\n        sync_text(self.trade_file, force=True)\n\n        return {\n\n            \"saved\": True,\n\n            \"trade_id\":\n                trade_id,\n\n            \"file\":\n                self.trade_file\n        }\n",
          )

          replace_once(
              "papertrade/trade_journal.py",
              "            writer.writerow(\n                row\n            )\n\n        return {\n\n            \"saved\": True,\n\n            \"file\":\n                self.signal_file\n        }\n",
              "            writer.writerow(\n                row\n            )\n\n        # Scanner signals are mirrored at most once per minute to avoid\n        # excessive GitHub content writes while retaining durable history.\n        sync_text(self.signal_file, force=False, min_interval=60.0)\n\n        return {\n\n            \"saved\": True,\n\n            \"file\":\n                self.signal_file\n        }\n",
          )

          # Add today's realized P&L helper before summary().
          marker = "    # ============================================================\n    # PERFORMANCE SUMMARY\n"
          p = Path("papertrade/trade_journal.py")
          text = p.read_text(encoding="utf-8-sig")
          if "def daily_pnl_today" not in text:
              if text.count(marker) != 1:
                  raise SystemExit("trade_journal.py: summary marker not found exactly once")
              method = '''    def daily_pnl_today(self):\n\n        df = self.get_trades()\n        if df.empty or \"pnl\" not in df.columns:\n            return 0.0\n\n        today = datetime.now().strftime(\"%Y-%m-%d\")\n        exit_dates = df.get(\"exit_time\", \"\").astype(str).str[:10]\n        pnl = pd.to_numeric(df[\"pnl\"], errors=\"coerce\").fillna(0.0)\n        return round(float(pnl[exit_dates == today].sum()), 2)\n\n'''
              text = text.replace(marker, method + marker, 1)
              p.write_text(text, encoding="utf-8")

          # ------------------------------------------------------------
          # TradingBot: restore today's realized P&L from durable journal.
          # ------------------------------------------------------------
          replace_once(
              "main.py",
              "        self.daily_pnl = 0.0\n",
              "        self.daily_pnl = self.journal.daily_pnl_today()\n",
          )

          print("Persistence hooks applied successfully.")
          PY

      - name: Commit persistence integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add papertrade/paper_trade_engine.py papertrade/trade_journal.py main.py
          git diff --cached --quiet && echo "No changes to commit" || git commit -m "Enable durable trade state and journal recovery"
          git push

      - name: Remove one-time patch workflow
        if: always()
        run: |
          git rm -f .github/workflows/apply-persistence-patch.yml || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git diff --cached --quiet && exit 0
          git commit -m "Remove one-time persistence patch workflow"
          git push
