name: File 04 Test - Dhan Live Price

on:
  workflow_dispatch:

jobs:
  test-file-04:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
      - name: Compile File 04
        run: python -m py_compile market/live_price.py
      - name: Run File 04 tests only
        env:
          PYTHONPATH: .
        run: python -m pytest -q tests/test_live_price_adapter.py
