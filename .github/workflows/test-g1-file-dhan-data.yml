name: G1 File 02 - Dhan Data
on:
  workflow_dispatch:
  push:
    paths:
      - 'market/dhan_data.py'
      - 'tests/test_dhan_data.py'
      - '.github/workflows/test-g1-file-dhan-data.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - name: Show tested revision
        run: |
          git rev-parse HEAD
          python -c "import market.dhan_data as d; print(d.__file__)"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run File 02 tests
        run: python -m pytest -q tests/test_dhan_data.py
