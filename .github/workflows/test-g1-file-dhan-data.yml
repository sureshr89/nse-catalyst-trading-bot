name: G1 File 02 - Dhan Data
on:
  workflow_dispatch:
  push:
    paths:
      - 'market/dhan_data.py'
      - 'tests/test_dhan_data.py'
      - '.github/workflows/test-g1-file-dhan-data.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install application and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest
      - name: Verify runtime dependencies
        run: |
          python -c "import pandas, requests, pytest; print('pandas', pandas.__version__); print('requests', requests.__version__); print('pytest', pytest.__version__)"
      - name: Show tested revision and source
        run: |
          git rev-parse HEAD
          python -c "import market.dhan_data as d; print(d.__file__)"
      - name: Run File 02 tests
        run: python -m pytest -q tests/test_dhan_data.py
