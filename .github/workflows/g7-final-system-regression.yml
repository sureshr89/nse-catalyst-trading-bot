name: G7 Final System Regression

on:
  workflow_dispatch:

jobs:
  regression:
    name: G7 Cross-Group Regression
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest pandas requests

      - name: Verify clean production imports
        env:
          PYTHONPATH: .
        run: |
          git rev-parse HEAD
          python -c "from engine.master_engine import MasterEngine; from papertrade.paper_trade_engine import PaperTradeEngine; from strategy.nifty500_price_action_strategies import evaluate; print('G7 production imports OK')"

      - name: Run cross-group regression contracts
        env:
          PYTHONPATH: .
        run: |
          python -m pytest -q \
            tests/test_clean_system_1_10.py \
            tests/test_clean_end_to_end_contract.py \
            tests/test_clean_s1_s5_regression.py \
            tests/test_master_engine.py \
            tests/test_master_clean_diagnostics.py \
            tests/test_g6_paper_execution_safety_final.py
