name: File 01 Test - S1-S5 Price Action

on:
  workflow_dispatch:

jobs:
  test-file-01:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Compile File 01
        run: python -m py_compile strategy/nifty500_price_action_strategies.py

      - name: Test File 01 only
        env:
          PYTHONPATH: .
        run: python -m pytest -q tests/test_nifty500_price_action_strategies.py
