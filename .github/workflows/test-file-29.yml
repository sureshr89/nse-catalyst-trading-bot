name: File 29 Test - Clean Master Diagnostics
on:
  workflow_dispatch:
jobs:
  test-file-29:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
      - run: python -m pytest -q tests/test_master_clean_diagnostics.py
        env:
          PYTHONPATH: .
