name: G1 - Market Dhan Price Data

on:
  workflow_dispatch:
  push:
    paths:
      - 'market/**'
      - 'master_data.py'
      - 'tests/test_dhan_data.py'
      - 'tests/test_dhan_data_extra.py'
      - 'tests/test_live_price_adapter.py'
      - 'tests/test_price_data.py'
      - 'tests/test_master_data.py'
      - 'tests/test_core.py'
      - '.github/workflows/g1-market-dhan-price-data.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - name: Show tested commit
        run: |
          git rev-parse HEAD
          git status --short
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest
      - name: Verify environment
        run: |
          python -c "import pandas, requests, pytest; print('pandas', pandas.__version__); print('requests', requests.__version__); print('pytest', pytest.__version__)"
      - name: Run G1 audited files
        env:
          PYTHONPATH: .
        run: |
          python -m pytest -q \
            tests/test_price_data.py \
            tests/test_dhan_data.py \
            tests/test_dhan_data_extra.py \
            tests/test_live_price_adapter.py \
            tests/test_master_data.py \
            tests/test_core.py
