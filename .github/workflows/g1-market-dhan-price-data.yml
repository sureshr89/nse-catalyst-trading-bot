name: G1 - Market Dhan Price Data

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Show tested commit
        run: git rev-parse HEAD
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
      - name: Run G1 tests
        env:
          PYTHONPATH: .
        run: |
          python -m pytest -q \
            tests/test_dhan_data.py \
            tests/test_dhan_data_extra.py \
            tests/test_live_price_adapter.py \
            tests/test_price_data.py \
            tests/test_master_data.py \
            tests/test_core.py
