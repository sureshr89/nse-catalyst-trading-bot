name: G1 File 01 - Price Data

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
      - name: Show tested revision
        run: |
          git rev-parse HEAD
          python -c "import market.price_data; print(market.price_data.__file__)"
      - name: Run File 01
        env:
          PYTHONPATH: .
        run: python -m pytest -q tests/test_price_data.py
