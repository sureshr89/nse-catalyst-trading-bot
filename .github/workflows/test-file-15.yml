name: File 15 Test - Closed Session
on:
  workflow_dispatch:
jobs:
  test-file-15:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
      - run: python -m py_compile market/closed_session.py
      - run: python -m pytest -q tests/test_closed_session.py
        env: {PYTHONPATH: .}
