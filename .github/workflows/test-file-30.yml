name: File 30 Test - Full S1-S5 Regression
on:
  workflow_dispatch:
jobs:
  test-file-30:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
      - run: |
          python -m py_compile engine/master_engine.py papertrade/paper_trade_engine.py strategy/nifty500_price_action_strategies.py
          python -m pytest -q tests/
        env:
          PYTHONPATH: .
