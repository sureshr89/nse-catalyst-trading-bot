name: File 30 Test - Clean S1-S5 Regression
on:
  workflow_dispatch:
jobs:
  test-file-30:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
      - run: |
          python -m py_compile strategy/contracts.py strategy/nifty500_price_action_strategies.py engine/master_engine.py papertrade/paper_trade_engine.py
          python -m pytest -q tests/test_clean_contract_boundaries.py tests/test_risk_position_sizing_clean.py tests/test_paper_trade_safety_clean.py tests/test_master_clean_diagnostics.py tests/test_clean_s1_s5_regression.py
        env:
          PYTHONPATH: .
