name: SYSTEM AUDIT 1

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: system-audit-live-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUNBUFFERED: '1'
  PYTHONPATH: .
  DHAN_CLIENT_ID: ${{ secrets.DHAN_CLIENT_ID }}
  DHAN_ACCESS_TOKEN: ${{ secrets.DHAN_ACCESS_TOKEN }}

jobs:
  live-audit:
    name: Live Market Validation (Read Only)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Verify Dhan credentials are present
        run: |
          test -n "$DHAN_CLIENT_ID"
          test -n "$DHAN_ACCESS_TOKEN"
          echo 'Dhan credentials: PRESENT'

      - name: Live Dhan NIFTY 500 quote validation
        run: |
          python - <<'PY'
          from config.settings import MIN_DATA_COVERAGE_COUNT
          from data.stock_universe import StockUniverse
          from market.dhan_data import configured, map_nifty500, market_quote, index_quote, dhan_status

          assert configured(), 'Dhan credentials are not configured.'
          universe = StockUniverse().get_dataframe(refresh=False)
          assert universe is not None and not universe.empty and 'Symbol' in universe.columns
          symbols = universe['Symbol'].astype(str).str.upper().str.replace('.NS', '', regex=False).drop_duplicates().tolist()
          assert len(symbols) == 500, f'Expected NIFTY 500 universe, got {len(symbols)}'

          mapping = map_nifty500(symbols, force=False)
          assert mapping is not None and len(mapping) >= MIN_DATA_COVERAGE_COUNT, f'Dhan mapping below gate: {len(mapping)}/500'

          quotes = market_quote(mapping)
          assert quotes is not None and len(quotes) >= MIN_DATA_COVERAGE_COUNT, f'Live quote coverage below gate: {len(quotes)}/500'
          required = {'Symbol','LTP','TodayOpen','TodayHigh','TodayLow','PreviousClose','change_pct','price_source'}
          assert required.issubset(quotes.columns), f'Missing quote columns: {required - set(quotes.columns)}'
          assert quotes['price_source'].astype(str).eq('DHAN_MARKETFEED_QUOTE').all()

          idx = index_quote('NIFTY 500')
          assert isinstance(idx, dict) and idx.get('LTP') is not None, 'NIFTY 500 index quote unavailable'

          print(f'LIVE Dhan quotes: {len(quotes)}/500')
          print(f'NIFTY 500 LTP: {idx.get("LTP")}')
          print(f'Dhan status: {dhan_status()}')
          PY

      - name: Live news connectivity and directional filter
        run: |
          python - <<'PY'
          from market.news_ranker import _fetch_batch, rank
          symbols = ['RELIANCE', 'TCS', 'HDFCBANK']
          result = _fetch_batch(symbols)
          assert isinstance(result, dict)
          assert set(result).issubset(set(symbols))
          # News is a directional safety filter, never an independent entry trigger.
          assert isinstance(rank(symbols, 'BUY'), list)
          assert isinstance(rank(symbols, 'SELL'), list)
          headline_count = sum(len(v) for v in result.values())
          print(f'News RSS connectivity: PASS; scored headlines: {headline_count}')
          PY

      - name: Read-only strategy readiness check
        run: |
          python - <<'PY'
          from config.settings import PAPER_TRADING, LIVE_TRADING, MIN_DATA_COVERAGE_COUNT
          from strategy.contracts import STRATEGY_RULES, STRATEGY_VERSION
          assert PAPER_TRADING is True and LIVE_TRADING is False
          assert set(STRATEGY_RULES) == {'S1','S2','S3','S4','S5'}
          assert MIN_DATA_COVERAGE_COUNT == 490
          print(f'Strategy contract: {STRATEGY_VERSION}')
          print('Execution mode: PAPER ONLY; no orders are placed by this workflow.')
          PY

      - name: Final live audit summary
        if: always()
        run: |
          echo '========================================'
          echo 'SYSTEM AUDIT 1: LIVE MARKET VALIDATION'
          echo 'Read-only: YES'
          echo 'Orders placed: NO'
          echo 'Dhan: LIVE'
          echo 'NIFTY 500 coverage gate: 490/500'
          echo 'News directional filter: tested'
          echo 'Execution: PAPER ONLY'
          echo '========================================'
