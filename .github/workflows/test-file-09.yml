name: File 09 Test - Sector Performance

on:
  workflow_dispatch:

jobs:
  test-file-09:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
      - name: Compile File 09
        run: python -m py_compile data/sector_alignment.py
      - name: Run File 09 tests only
        env:
          PYTHONPATH: .
        run: python -m pytest -q tests/test_sector_alignment.py
