name: Complete Priority 1 persistence

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply persistence fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          # 1) Paper engine: durable open-position + capital state.
          p = Path('papertrade/paper_trade_engine.py')
          text = p.read_text(encoding='utf-8-sig')
          text = text.replace('from datetime import datetime\n', 'from datetime import datetime\nimport json\nimport os\n\nfrom papertrade.persistent_storage import restore_json, sync_json\n', 1)
          text = text.replace('        self.used_capital = 0\n', '        self.used_capital = 0\n\n        # Restore durable runtime state after Streamlit/container restart.\n        self._restore_state()\n', 1)
          marker = '    # ============================================================\n    # TIME HELPERS\n'
          methods = '''    def _state_path(self):\n        return os.path.join("outputs", "paper_engine_state.json")\n\n    def _restore_state(self):\n        path = self._state_path()\n        repo_path = path.replace(os.sep, "/")\n        try:\n            restore_json(path, repo_path)\n            if not os.path.exists(path):\n                return\n            with open(path, "r", encoding="utf-8") as file:\n                state = json.load(file)\n            self.open_positions = state.get("open_positions", {}) or {}\n            self.closed_positions = state.get("closed_positions", []) or []\n            self.trade_counter = int(state.get("trade_counter", 0) or 0)\n            self.total_capital = float(state.get("total_capital", TOTAL_CAPITAL) or TOTAL_CAPITAL)\n            self.available_capital = float(state.get("available_capital", TOTAL_CAPITAL) or TOTAL_CAPITAL)\n            self.used_capital = float(state.get("used_capital", 0) or 0)\n            print(f"Persistent paper state restored: {len(self.open_positions)} open position(s)")\n        except Exception as error:\n            print(f"Paper state restore skipped: {type(error).__name__}: {error}")\n\n    def _save_state(self):\n        path = self._state_path()\n        os.makedirs(os.path.dirname(path), exist_ok=True)\n        state = {\n            "open_positions": self.open_positions,\n            "closed_positions": self.closed_positions,\n            "trade_counter": self.trade_counter,\n            "total_capital": self.total_capital,\n            "available_capital": self.available_capital,\n            "used_capital": self.used_capital,\n            "saved_at": datetime.now().isoformat(),\n        }\n        try:\n            with open(path, "w", encoding="utf-8") as file:\n                json.dump(state, file, ensure_ascii=False, indent=2, default=str)\n            sync_json(path, path.replace(os.sep, "/"), "Persist paper trading runtime state")\n        except Exception as error:\n            print(f"Paper state sync skipped: {type(error).__name__}: {error}")\n\n'''
          if 'def _state_path' not in text:
              if marker not in text:
                  raise RuntimeError('engine marker not found')
              text = text.replace(marker, methods + marker, 1)
          # Persist immediately after an entry is placed.
          needle = '''        self.available_capital -= position_value\n\n        return {\n'''
          if 'self._save_state()' not in text:
              if needle not in text:
                  raise RuntimeError('open trade save marker not found')
              text = text.replace(needle, '        self.available_capital -= position_value\n\n        self._save_state()\n\n        return {\n', 1)
          # Persist immediately after a position is removed/closed.
          needle2 = '''        del self.open_positions[\n            symbol\n        ]\n\n        return closed\n'''
          if needle2 in text and text.count('self._save_state()') < 2:
              text = text.replace(needle2, '''        del self.open_positions[\n            symbol\n        ]\n\n        self._save_state()\n\n        return closed\n''', 1)
          p.write_text(text, encoding='utf-8')

          # 2) Ensure an OPEN journal row is saved immediately on entry.
          p = Path('main.py')
          text = p.read_text(encoding='utf-8-sig')
          needle = '''        print(\n            "Actual Risk       :",\n            position.get(\n                "actual_risk"\n            )\n        )\n'''
          if 'Entry Journal Saved:' not in text:
              if needle not in text:
                  raise RuntimeError('main entry output marker not found')
              addition = needle + '''\n        # Persist the OPEN trade immediately so a reboot cannot lose it.\n        position["status"] = "OPEN"\n        entry_save = self.journal.log_trade(position)\n        print(\n            "Entry Journal Saved:",\n            entry_save.get("saved", False)\n        )\n'''
              text = text.replace(needle, addition, 1)
          p.write_text(text, encoding='utf-8')
          PY
      - name: Validate syntax
        run: python -m py_compile main.py papertrade/paper_trade_engine.py papertrade/trade_journal.py papertrade/persistent_storage.py
      - name: Commit changes and remove one-time workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add main.py papertrade/paper_trade_engine.py
          git diff --cached --quiet || git commit -m "Complete Priority 1 persistence"
          git push
          git rm -f .github/workflows/complete-priority1.yml
          git diff --cached --quiet || git commit -m "Remove one-time Priority 1 workflow"
          git push
