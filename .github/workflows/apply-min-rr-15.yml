name: Apply minimum risk reward 1.5

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply minimum R:R 1.5
        run: |
          python - <<'PY'
          from pathlib import Path

          settings = Path('config/settings.py')
          text = settings.read_text()
          old = 'RISK_REWARD_RATIO = 1.0'
          new = 'RISK_REWARD_RATIO = 1.5'
          if old in text:
              text = text.replace(old, new, 1)
          elif 'RISK_REWARD_RATIO = 1.5' not in text:
              raise SystemExit('RISK_REWARD_RATIO setting not found')
          if 'MIN_RR_RATIO = 1.5' not in text:
              text = text.replace('RISK_REWARD_RATIO = 1.5\n', 'RISK_REWARD_RATIO = 1.5\nMIN_RR_RATIO = 1.5\n', 1)
          settings.write_text(text)

          risk = Path('strategy/risk_engine.py')
          text = risk.read_text()
          old_import = '    RISK_PERCENT,\n    MAX_TRADES_PER_STOCK,\n)'
          new_import = '    RISK_PERCENT,\n    MAX_TRADES_PER_STOCK,\n    MIN_RR_RATIO,\n)'
          if old_import in text:
              text = text.replace(old_import, new_import, 1)
          elif '    MIN_RR_RATIO,\n)' not in text:
              raise SystemExit('risk engine settings import anchor not found')

          old_calc = '''        position_value = risk[\n            "position_value"\n        ]\n\n        # --------------------------------------------------------\n        # MINIMUM RISK\n        # --------------------------------------------------------'''
          new_calc = '''        position_value = risk[\n            "position_value"\n        ]\n\n        # --------------------------------------------------------\n        # MINIMUM RISK : REWARD\n        #\n        # Every new setup must provide at least 1:1.5.\n        # --------------------------------------------------------\n\n        if signal == "BUY":\n            reward_per_share = target - entry\n        else:\n            reward_per_share = entry - target\n\n        reward = reward_per_share * quantity\n        rr_ratio = (reward / actual_risk) if actual_risk > 0 else 0.0\n\n        if rr_ratio < float(MIN_RR_RATIO):\n            reasons.append(\n                f"Risk:Reward {rr_ratio:.2f} is below minimum "\n                f"1:{float(MIN_RR_RATIO):.1f}"\n            )\n\n        # --------------------------------------------------------\n        # MINIMUM RISK\n        # --------------------------------------------------------'''
          if old_calc in text:
              text = text.replace(old_calc, new_calc, 1)
          elif 'Risk:Reward {rr_ratio:.2f} is below minimum' not in text:
              raise SystemExit('risk/reward insertion anchor not found')

          old_return = '''            "actual_risk":\n                actual_risk,\n\n            "position_value":\n                position_value,\n\n            "min_required_risk":'''
          new_return = '''            "actual_risk":\n                actual_risk,\n\n            "reward":\n                round(reward, 2),\n\n            "rr":\n                round(rr_ratio, 4),\n\n            "min_rr_ratio":\n                float(MIN_RR_RATIO),\n\n            "position_value":\n                position_value,\n\n            "min_required_risk":'''
          if old_return in text:
              text = text.replace(old_return, new_return, 1)
          elif '"min_rr_ratio"' not in text:
              raise SystemExit('risk/reward return anchor not found')

          risk.write_text(text)
          PY

      - name: Validate Python syntax
        run: |
          python -m py_compile config/settings.py strategy/risk_engine.py

      - name: Commit and remove one-shot workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add config/settings.py strategy/risk_engine.py .github/workflows/apply-min-rr-15.yml
          git commit -m 'Enforce minimum risk reward ratio 1.5' || exit 0
          git rm .github/workflows/apply-min-rr-15.yml
          git add config/settings.py strategy/risk_engine.py
          git commit --amend --no-edit
          git push
