name: SYSTEM AUDIT

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '30 3 * * 1-5'

permissions:
  contents: read

concurrency:
  group: system-audit-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUNBUFFERED: '1'
  PYTHONPATH: .

jobs:
  audit:
    name: Full Project Audit
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest

      - name: Dependency integrity
        run: python -m pip check

      - name: Repository hygiene
        run: |
          git diff --check
          test -f config/settings.py
          test -f requirements.txt
          test -f main.py
          test -d config
          test -d data
          test -d market
          test -d strategy
          test -d scanner
          test -d engine
          test -d papertrade
          test -d journal
          test -d outputs
          test -d utils
          test -d tests
          test -d .github/workflows

      - name: Python syntax audit
        run: python -m compileall -q config data market strategy scanner engine papertrade journal utils main.py dashboard

      - name: Production import audit
        run: |
          python - <<'PY'
          import importlib
          modules = [
              'main',
              'config.settings',
              'config.trading_limits',
              'config.trading_rules',
              'data.reference_store',
              'data.stock_universe',
              'data.sector_alignment',
              'market.dhan_data',
              'market.price_data',
              'market.nifty500_breadth',
              'market.live_quote_bridge',
              'market.news_ranker',
              'strategy.contracts',
              'strategy.nifty500_price_action_strategies',
              'strategy.risk_engine',
              'scanner.scanner',
              'engine.master_engine',
              'engine.cycle_runner',
              'papertrade.paper_trade_engine',
              'journal.trade_journal',
              'dashboard.app',
          ]
          for module in modules:
              importlib.import_module(module)
              print(f'IMPORT OK: {module}')
          PY

      - name: Canonical strategy and timing contract
        run: |
          python - <<'PY'
          from config import settings, trading_limits, trading_rules
          from strategy.contracts import STRATEGY_RULES
          from strategy.nifty500_price_action_strategies import STRATEGY_DEFINITIONS

          assert settings.PAPER_TRADING is True
          assert settings.LIVE_TRADING is False
          assert settings.STOCK_UNIVERSE == 'NIFTY_500'
          assert settings.MAX_STOCKS == 500
          assert settings.MIN_DATA_COVERAGE_COUNT == 490
          assert settings.MIN_DATA_COVERAGE_PCT == 98.0
          assert settings.COLLECTION_WINDOW_SECONDS == 15
          assert settings.DECISION_WINDOW_SECONDS == 10
          assert settings.SCAN_INTERVAL_SECONDS == 25
          assert settings.ALLOCATED_CAPITAL_PER_TRADE == trading_limits.CAPITAL_PER_TRADE == trading_rules.CAPITAL_PER_STRATEGY
          assert settings.MIN_REQUIRED_RISK == trading_limits.MIN_TRADE_RISK == trading_rules.RISK_MIN
          assert settings.MAX_RISK_PER_TRADE == trading_limits.MAX_TRADE_RISK == trading_rules.RISK_MAX
          assert settings.RISK_REWARD_RATIO == trading_limits.TARGET_R_MULTIPLE == trading_rules.TARGET_RR
          assert set(STRATEGY_RULES) == {'S1','S2','S3','S4','S5'}
          assert set(STRATEGY_DEFINITIONS) == {'S1','S2','S3','S4','S5'}
          print('Canonical contract: PASS')
          PY

      - name: Dhan and news boundary audit
        run: |
          python - <<'PY'
          import inspect
          import market.dhan_data as dhan
          import market.news_ranker as news
          from market.price_data import PriceData
          from market.live_quote_bridge import market_quote_partial

          assert callable(dhan.configured)
          assert callable(dhan.market_quote)
          assert callable(market_quote_partial)
          assert callable(news.rank)
          assert callable(news.refresh_async)
          assert callable(news.snapshot)
          assert 'DHAN_MARKETFEED_QUOTE' in inspect.getsource(PriceData.get_latest_live_price)
          print('Dhan/news boundaries: PASS')
          PY

      - name: Full pytest regression
        run: python -m pytest -q

      - name: Streamlit startup smoke test
        run: |
          set -e
          nohup python -m streamlit run dashboard/app.py --server.headless true --server.port 8501 > /tmp/streamlit.log 2>&1 &
          pid=$!
          ready=0
          for _ in $(seq 1 30); do
            if python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8501/_stcore/health', timeout=2).read()" >/dev/null 2>&1; then
              ready=1
              break
            fi
            sleep 1
          done
          cat /tmp/streamlit.log
          kill "$pid" 2>/dev/null || true
          if [ "$ready" -ne 1 ]; then
            echo 'Streamlit startup health check failed.'
            exit 1
          fi
          echo 'Streamlit startup health check: PASS'

      - name: Final audit summary
        if: always()
        run: |
          echo '========================================'
          echo 'FINAL PROJECT AUDIT'
          echo 'Python: 3.12'
          echo 'Universe: NIFTY 500'
          echo 'Strategies: S1 S2 S3 S4 S5'
          echo 'Execution: PAPER ONLY'
          echo 'Coverage gate: 490/500'
          echo 'Collection budget: 15s'
          echo 'Decision budget: 10s'
          echo 'Cycle interval: 25s'
          echo 'News filter: enabled in decision cycle'
          echo 'Dashboard smoke test: enabled'
          echo 'Full pytest: enabled'
          echo '========================================'
