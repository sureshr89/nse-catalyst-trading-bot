name: Master Test 11-20

on:
  workflow_dispatch:

# GROUP 11-20 — runtime/data integration, live price and engine tests.
# Do not move tests between groups without changing the group contract.

jobs:
  test-11-20:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
      - name: Compile group modules
        run: |
          python -m py_compile market/closed_session.py
          python -m py_compile market/live_price.py
          python -m py_compile market/price_data.py
          python -m py_compile engine/master_engine.py
          python -m py_compile strategy/contracts.py
          python -m py_compile papertrade/paper_trade_engine.py
      - name: Run GROUP 11-20 only
        env:
          PYTHONPATH: .
        run: >-
          python -m pytest -q
          tests/test_closed_session.py
          tests/test_live_price_adapter.py
          tests/test_price_data.py
          tests/test_master_engine.py
          tests/test_strategy_integration_contract.py
