name: Master Test 21-30

on:
  workflow_dispatch:

# GROUP 21-30 — clean S1-S5 contracts, safety, risk and regression tests.
# Do not move tests between groups without changing the group contract.

jobs:
  test-21-30:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
      - name: Compile group modules
        run: |
          python -m py_compile strategy/contracts.py
          python -m py_compile strategy/nifty500_price_action_strategies.py
          python -m py_compile engine/master_engine.py
          python -m py_compile papertrade/paper_trade_engine.py
      - name: Run GROUP 21-30 only
        env:
          PYTHONPATH: .
        run: >-
          python -m pytest -q
          tests/test_clean_contract_boundaries.py
          tests/test_clean_end_to_end_contract.py
          tests/test_clean_s1_s5_regression.py
          tests/test_clean_system_1_10.py
          tests/test_master_clean_diagnostics.py
          tests/test_risk_position_sizing_clean.py
          tests/test_paper_state_clean.py
          tests/test_paper_trade_safety_clean.py
          tests/test_master_engine_clean.py
          tests/test_strategy_contract_clean.py
