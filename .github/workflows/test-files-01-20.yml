name: Full Test 01-20

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Compile Python files
        run: python -m compileall -q .

      - name: Run tests 01-20
        env:
          PYTHONPATH: .
        run: |
          python -m pytest -q \
            tests/test_nifty500_price_action_strategies.py \
            tests/test_master_engine.py \
            tests/test_price_data.py \
            tests/test_nifty500_breadth.py \
            tests/test_dhan_data.py
