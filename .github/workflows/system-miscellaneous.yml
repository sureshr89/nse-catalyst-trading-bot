name: SYSTEM MISCELLANEOUS

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - 'requirements.txt'
      - '.gitignore'
      - 'README.md'
      - '.devcontainer/**'

permissions:
  contents: read

jobs:
  hygiene:
    name: Repository Hygiene Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Dependency integrity
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip check

      - name: Repository structure
        run: |
          test -f main.py
          test -f requirements.txt
          test -d config
          test -d data
          test -d market
          test -d strategy
          test -d scanner
          test -d engine
          test -d papertrade
          test -d journal
          test -d outputs
          test -d utils
          test -d tests
          test -d dashboard
          test -d .github/workflows

      - name: Python cache / generated-file hygiene
        run: |
          if find . -type d -name '__pycache__' -not -path './.git/*' | grep -q .; then
            echo 'Tracked/runtime __pycache__ directories must not be present in the repository.'
            exit 1
          fi
          if find . -type f \( -name '*.pyc' -o -name '*.pyo' \) -not -path './.git/*' | grep -q .; then
            echo 'Python bytecode files must not be present in the repository.'
            exit 1
          fi

      - name: Git whitespace check
        run: git diff --check

      - name: Workflow inventory
        run: |
          echo 'Active workflow files:'
          find .github/workflows -maxdepth 1 -type f -name '*.yml' -o -name '*.yaml' | sort
          count=$(find .github/workflows -maxdepth 1 -type f \( -name '*.yml' -o -name '*.yaml' \) | wc -l)
          echo "Workflow count: $count"

      - name: Final summary
        run: |
          echo 'SYSTEM MISCELLANEOUS: PASS'
          echo 'Repository hygiene, dependency integrity and workflow inventory checked.'
