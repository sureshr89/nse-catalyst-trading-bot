name: File 27 Test - Risk And Position Sizing
on:
  workflow_dispatch:
jobs:
  test-file-27:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
      - run: python -m pytest -q tests/test_risk_position_sizing.py
        env:
          PYTHONPATH: .
