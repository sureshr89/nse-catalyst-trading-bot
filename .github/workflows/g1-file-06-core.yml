name: G1 File 06 - Core
on:
  workflow_dispatch:
  push:
    paths:
      - 'tests/test_core.py'
      - 'config/**'
      - 'dashboard/**'
      - 'papertrade/**'
      - 'strategy/**'
      - 'main.py'
      - 'engine/**'
      - 'market/price_data.py'
      - '.github/workflows/g1-file-06-core.yml'
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest
      - name: Verify environment
        run: |
          git rev-parse HEAD
          python -c "import pandas, requests, pytest; print('dependencies OK')"
      - name: Run File 06
        run: python -m pytest -q tests/test_core.py
