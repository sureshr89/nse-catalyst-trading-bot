name: File 06 Test - Price Data
on:
  workflow_dispatch:
jobs:
  test-file-06:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
      - name: Compile File 06
        run: python -m py_compile market/price_data.py
      - name: Run File 06 tests only
        env:
          PYTHONPATH: .
        run: python -m pytest -q tests/test_price_data.py
