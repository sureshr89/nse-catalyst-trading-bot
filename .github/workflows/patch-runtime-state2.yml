name: Patch paper engine runtime state recovery

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch files
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8-sig')
              n = text.count(old)
              print(path, 'matches', n)
              if n != 1:
                  raise RuntimeError(f'{path}: expected one match, got {n}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          engine = 'papertrade/paper_trade_engine.py'
          replace_once(engine,
              'from config.settings import (\n',
              'from papertrade.persistent_storage import restore, sync\n\nfrom config.settings import (\n')
          replace_once(engine,
              '        self.available_capital = TOTAL_CAPITAL\n        self.used_capital = 0\n',
              '''        self.available_capital = TOTAL_CAPITAL
        self.used_capital = 0

        self._state_file = "outputs/paper_engine_state.json"
        self._state_repo_path = "outputs/paper_engine_state.json"
        self._restore_state()

    def _restore_state(self):
        try:
            restore(self._state_file, self._state_repo_path)
            path = Path(self._state_file)
            if not path.exists() or path.stat().st_size == 0:
                return
            import json
            state = json.loads(path.read_text(encoding="utf-8"))
            if state.get("date") != datetime.now().strftime("%Y-%m-%d"):
                return
            self.open_positions = state.get("open_positions", {}) or {}
            self.closed_positions = state.get("closed_positions", []) or []
            self.trade_counter = int(state.get("trade_counter", 0) or 0)
            self.available_capital = float(state.get("available_capital", TOTAL_CAPITAL) or TOTAL_CAPITAL)
            self.used_capital = float(state.get("used_capital", 0) or 0)
        except Exception as error:
            print(f"Paper state restore skipped: {type(error).__name__}: {error}")

    def _persist_state(self):
        try:
            import json
            path = Path(self._state_file)
            path.parent.mkdir(parents=True, exist_ok=True)
            payload = {
                "date": datetime.now().strftime("%Y-%m-%d"),
                "open_positions": self.open_positions,
                "closed_positions": self.closed_positions[-100:],
                "trade_counter": self.trade_counter,
                "available_capital": self.available_capital,
                "used_capital": self.used_capital,
            }
            path.write_text(json.dumps(payload, indent=2, default=str), encoding="utf-8")
            sync(self._state_file, self._state_repo_path, "Persist paper engine state")
        except Exception as error:
            print(f"Paper state persistence skipped: {type(error).__name__}: {error}")
''')
          replace_once(engine,
              '        self.used_capital += position_value\n        self.available_capital -= position_value\n\n        return {\n',
              '        self.used_capital += position_value\n        self.available_capital -= position_value\n        self._persist_state()\n\n        return {\n')
          replace_once(engine,
              '        del self.open_positions[\n            symbol\n        ]\n\n        return closed\n',
              '        del self.open_positions[\n            symbol\n        ]\n        self._persist_state()\n\n        return closed\n')

          main = 'main.py'
          replace_once(main,
              '        self.daily_pnl = 0.0\n',
              '        self.daily_pnl = self._restore_daily_pnl()\n')
          marker = '    # ============================================================\n    # CURRENT TIME\n'
          p = Path(main)
          text = p.read_text(encoding='utf-8-sig')
          if 'def _restore_daily_pnl' not in text:
              if text.count(marker) != 1:
                  raise RuntimeError('main.py CURRENT TIME marker mismatch')
              method = '''    def _restore_daily_pnl(self):

        try:
            df = self.journal.get_trades()
            if df.empty or "pnl" not in df.columns:
                return 0.0
            today = datetime.now().strftime("%Y-%m-%d")
            exit_dates = df["exit_time"].astype(str).str[:10]
            pnl = __import__("pandas").to_numeric(df["pnl"], errors="coerce").fillna(0.0)
            return round(float(pnl[exit_dates == today].sum()), 2)
        except Exception as error:
            print(f"Daily P&L restore skipped: {type(error).__name__}: {error}")
            return 0.0

'''
              p.write_text(text.replace(marker, method + marker, 1), encoding='utf-8')

          print('PATCH SUCCESS')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add papertrade/paper_trade_engine.py main.py
          git commit -m 'Persist open positions and daily PnL across reboot'
          git push
