name: G1 File 01 - Price Data Behavioral

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest
      - name: Verify source and dependencies
        run: |
          git rev-parse HEAD
          python -c "import pandas, requests, pytest; print('dependencies OK')"
          python -c "import market.price_data as p; print(p.__file__)"
      - name: Run File 01 behavioral tests
        env:
          PYTHONPATH: .
        run: python -m pytest -q tests/test_price_data.py
