name: Python checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile every Python file
        run: python -m compileall -q .
      - name: Import core modules
        run: python -c "from config import settings; from strategy.open_reversal_engine import OpenReversalEngine; from strategy.risk_engine import RiskEngine; from scanner.scanner_engine import ScannerEngine; from papertrade.trade_journal_clean import TradeJournal; from papertrade.paper_trade_engine import PaperTradeEngine; from main import TradingBot; print('Core imports OK')"
