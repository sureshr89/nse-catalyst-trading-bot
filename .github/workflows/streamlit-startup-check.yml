name: STREAMLIT STARTUP CHECK

on:
  workflow_dispatch:

jobs:
  streamlit-startup:
    name: Dashboard Startup Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then python -m pip install -r requirements.txt; fi
          python -m pip install streamlit pandas requests

      - name: Start Streamlit dashboard
        env:
          PYTHONPATH: .
        run: |
          nohup python -m streamlit run dashboard/app.py --server.headless true --server.port 8501 > /tmp/streamlit.log 2>&1 &
          echo $! > /tmp/streamlit.pid

      - name: Wait for dashboard
        run: |
          python - <<'PY'
          import time
          import urllib.request
          url = 'http://127.0.0.1:8501/_stcore/health'
          for _ in range(30):
              try:
                  with urllib.request.urlopen(url, timeout=2) as r:
                      if r.status == 200:
                          print('STREAMLIT STARTUP: OK')
                          raise SystemExit(0)
              except Exception:
                  time.sleep(1)
          print(open('/tmp/streamlit.log', encoding='utf-8', errors='replace').read())
          raise SystemExit('Streamlit dashboard did not become healthy')

      - name: Stop dashboard
        if: always()
        run: |
          if [ -f /tmp/streamlit.pid ]; then kill $(cat /tmp/streamlit.pid) || true; fi
