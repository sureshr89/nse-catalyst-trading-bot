name: G1 MASTER Files 01-06

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest
      - name: Verify environment
        run: |
          git rev-parse HEAD
          python -c "import pandas, requests, pytest; print('dependencies OK')"
      - name: Run audited G1 files
        env:
          PYTHONPATH: .
        run: |
          python -m pytest -q \
            tests/test_price_data.py \
            tests/test_dhan_data.py \
            tests/test_dhan_data_extra.py \
            tests/test_live_price_adapter.py \
            tests/test_master_data.py \
            tests/test_core.py
