name: File 02 Test - Master Engine

on:
  workflow_dispatch:

jobs:
  test-file-02:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
      - name: Compile File 02
        run: python -m py_compile engine/master_engine.py
      - name: Run File 02 tests only
        env:
          PYTHONPATH: .
        run: python -m pytest -q tests/test_master_engine.py
