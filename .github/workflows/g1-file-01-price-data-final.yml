name: G1 File 01 Price Data FINAL

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact audited commit
        uses: actions/checkout@v4
        with:
          ref: 1bbeba1f3f6a39a7f3714bb301fb7ef2417e7cfb
          fetch-depth: 1

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest

      - name: Verify exact source
        run: |
          echo "EXPECTED_COMMIT=1bbeba1f3f6a39a7f3714bb301fb7ef2417e7cfb"
          echo "ACTUAL_COMMIT=$(git rev-parse HEAD)"
          test "$(git rev-parse HEAD)" = "1bbeba1f3f6a39a7f3714bb301fb7ef2417e7cfb"
          python -c "import pandas, requests, pytest; print('dependencies OK')"
          python -c "import market.price_data as p; print('PRICE_DATA=', p.__file__)"

      - name: Direct Dhan live-price behavioral smoke test
        env:
          PYTHONPATH: .
        run: |
          python - <<'PY'
          import pandas as pd
          from unittest.mock import patch
          from market.price_data import PriceData

          symbol = 'PRICE_TEST_UNIQUE'
          PriceData._live_price_cache.pop(symbol, None)
          PriceData._live_price_cache_at.pop(symbol, None)
          obj = PriceData()
          mapping = pd.DataFrame([{'Symbol': symbol, 'SecurityId': '123'}])
          quote = pd.DataFrame([{
              'SecurityId': '123', 'Symbol': symbol, 'LTP': 110,
              'TodayOpen': 108, 'TodayHigh': 112, 'TodayLow': 107,
              'PreviousClose': 105, 'NetChange': 5
          }])
          with patch.object(obj, '_map', return_value=mapping), \
               patch.object(obj, '_dhan_configured', return_value=True), \
               patch.object(obj, '_dhan_market_quote', return_value=quote):
              result = obj.get_latest_live_price(symbol, max_age_seconds=0)
          print('RESULT=', result)
          assert result is not None
          assert result['price_source'] == 'DHAN_OHLC'
          assert result['Close'] == 110.0
          assert result['Open'] == 108.0
          assert result['High'] == 112.0
          assert result['Low'] == 107.0
          assert result['PreviousClose'] == 105.0
          assert result['NetChange'] == 5.0
          print('DIRECT SMOKE TEST: GREEN')
          PY

      - name: Run File 01 tests
        env:
          PYTHONPATH: .
        run: python -m pytest -q tests/test_price_data.py
