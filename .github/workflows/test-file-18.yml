name: File 18 Test - NIFTY 500 Breadth
on: {workflow_dispatch:}
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -r requirements.txt pytest
      - run: python -m py_compile market/nifty500_breadth.py
      - run: python -m pytest -q tests/test_nifty500_breadth.py
        env: {PYTHONPATH: .}
