name: File 23 Test - Paper State Safety
on:
  workflow_dispatch:
jobs:
  test-file-23:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
      - run: python -m py_compile papertrade/paper_trade_engine.py
      - run: python -m pytest -q tests/test_paper_state_clean.py
        env:
          PYTHONPATH: .
